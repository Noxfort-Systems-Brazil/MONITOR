[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "noxfort-monitor"
version = "2.0.1"
description = "Industrial Telemetry Ingestion, Observability & Incident Response Orchestration"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Gabriel Moraes", email = "suporte@noxfort.com" },
    { name = "Noxfort Systems", email = "contato@noxfort.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "pymdown-extensions>=10.7"
]

[project.urls]
Homepage = "https://github.com/Noxfort-Systems-Brazil/MONITOR"
Documentation = "https://github.com/Noxfort-Systems-Brazil/MONITOR#readme"
Repository = "https://github.com/Noxfort-Systems-Brazil/MONITOR.git"
"Issue Tracker" = "https://github.com/Noxfort-Systems-Brazil/MONITOR/issues"
